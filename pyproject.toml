[project]
name = "pdf-anonymizer-tool"
version = "0.1.0"
description = "A sophisticated tool that can anonymize content and give embedding-ready JSON files."
requires-python = ">=3.11,<4"
dependencies = [
    "anthropic>=0.45.2",
    "openai>=1.61.1",
    "pypdf2>=3.0.1",
    "reportlab>=4.3.0",
    "streamlit>=1.42.0",
    "twilio>=9.4.5",
]

[tool.poetry]
package-mode = false
